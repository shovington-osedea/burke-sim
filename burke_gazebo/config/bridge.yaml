# ROS-facing contract for the fixed-name burke_base model.
# When the model is spawned from robot_description, Gazebo Harmonic resolves
# these DiffDrive topic names globally.
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
  qos_profile: CLOCK

# Arm command topics use one scalar Float64 per joint. The Gazebo topics are
# explicitly scoped to the fixed spawned model name to avoid collisions with
# another model in a future world.
- ros_topic_name: "/arm/joint_1/command"
  gz_topic_name: "/model/burke_base/arm/joint_1/command"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm/joint_2/command"
  gz_topic_name: "/model/burke_base/arm/joint_2/command"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm/joint_3/command"
  gz_topic_name: "/model/burke_base/arm/joint_3/command"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm/joint_4/command"
  gz_topic_name: "/model/burke_base/arm/joint_4/command"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm/joint_5/command"
  gz_topic_name: "/model/burke_base/arm/joint_5/command"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm/joint_6/command"
  gz_topic_name: "/model/burke_base/arm/joint_6/command"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Lift command topics expose the two physical prismatic joints independently.
# Targets are metres and are bounded by the corresponding URDF joint limits.
- ros_topic_name: "/lift/stage_2/command"
  gz_topic_name: "/model/burke_base/lift/stage_2/command"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/lift/stage_3/command"
  gz_topic_name: "/model/burke_base/lift/stage_3/command"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/joint_states"
  gz_topic_name: "/model/burke_base/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
